services:
  solr-9-11:
    image: solr:${SOLR_VERSION:-9.11.0}
    container_name: solr-9-11
    restart: unless-stopped
    ports:
      - "${SOLR_PORT:-8983}:8983"
    environment:
      SOLR_HEAP: "${SOLR_HEAP:-2g}"
      SOLR_MODULES: "analysis-extras"
      SOLR_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Xlog:gc*:stdout
        -Dsolr.security.allow.urls.enabled=false
        -Dsolr.logs.dir=/var/solr/logs
        --add-modules=jdk.incubator.vector
    command:
      - solr
      - start
      - -f
      - --user-managed
    volumes:
      - ./volume/solr:/var/solr
      - ./volume/solr/data/jars/MarcImporter.jar:/opt/solr/server/solr-webapp/webapp/WEB-INF/lib/MarcImporter.jar:ro
      - ./volume/solr/data/jars/browse-handler.jar:/opt/solr/server/solr-webapp/webapp/WEB-INF/lib/browse-handler.jar:ro
      - ./volume/solr/data/jars/sqlite-jdbc-3.39.3.0.jar:/opt/solr/server/solr-webapp/webapp/WEB-INF/lib/sqlite-jdbc-3.39.3.0.jar:ro
